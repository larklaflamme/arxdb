[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxdb"
version = "0.1.0"
description = "A content-addressed, signed, append-only reasoning-graph substrate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Skye Laflamme", email = "skye@ravennest.science" },
]
dependencies = [
    "blake3>=0.4",
    "cbor2>=5.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
